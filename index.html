<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CTG Canteen Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* --- BACKGROUND AND RESET --- */
        html, body { 
            height: 100%; 
            margin: 0;
            overflow: hidden; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Light creamy background */
            background: radial-gradient(ellipse at center, rgba(255,254,234,1) 0%, rgba(255,254,234,1) 35%, #B7E8EB 100%);
            position: relative;
        }

        /* --- ANIMATED OCEAN WAVES --- */
        .ocean { 
            height: 5%;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            background: #015871;
            z-index: 1; /* Behind container, above body */
        }

        .wave {
            background: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/85486/wave.svg) repeat-x; 
            position: absolute;
            top: -198px;
            width: 6400px;
            height: 198px;
            animation: wave 7s cubic-bezier( 0.36, 0.45, 0.63, 0.53) infinite;
            transform: translate3d(0, 0, 0);
        }

        .wave:nth-of-type(2) {
            top: -175px;
            animation: wave 7s cubic-bezier( 0.36, 0.45, 0.63, 0.53) -.125s infinite, swell 7s ease -1.25s infinite;
            opacity: 1;
        }

        @keyframes wave {
            0% { margin-left: 0; }
            100% { margin-left: -1600px; }
        }

        @keyframes swell {
            0%, 100% { transform: translate3d(0,-25px,0); }
            50% { transform: translate3d(0,5px,0); }
        }

        /* --- CONTAINER --- */
        .container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            width: 90%;
            max-width: 550px;
            box-sizing: border-box;
            z-index: 10; /* Keep it above the waves */
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- LOGO STYLING --- */
        .logo {
            width: 130px; 
            height: auto;
            margin-bottom: 5px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #333;
            font-size: 38px;
            margin: 15px 0 45px 0;
            font-weight: 500;
        }

        /* --- BUTTON STYLE --- */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background-color: #cd7355; 
            color: #fff;
            padding: 10px 35px 10px 10px;
            font-size: 22px;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0px 8px 25px rgba(205, 115, 85, 0.3);
        }

        .button:hover {
            background-color: #b86347;
            transform: translateY(-3px);
            box-shadow: 0px 12px 30px rgba(205, 115, 85, 0.4);
        }

        .button .icon-circle {
            background: #1a305e; 
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 28px;
        }

        /* --- FOOTER --- */
        .footer { 
            position: absolute;
            bottom: 25px;
            font-size: 16px; 
            color: #015871; 
            font-weight: 600;
            z-index: 20;
        }

        @media (max-width: 768px) {
            h1 { font-size: 28px; }
            .button { width: 100%; font-size: 18px; }
            .container { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.ibb.co.com/qLL6VTxz/Logo.png" alt="BIOM Logo" class="logo">
        
        <h2>Welcome Biom Database</h2>
        
        <a href="https://n8n-56.onrender.com/form/d67776d1-e54a-41fc-97fa-d2bbfeb9228b" target="_blank" style="text-decoration: none;">
            <button class="button">
                <div class="icon-circle">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                Biom Student Info
            </button>
        </a>
    </div>

    <footer class="footer">
        Biom Portal &copy; 2026
    </footer>

    <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

</body>
</html>
